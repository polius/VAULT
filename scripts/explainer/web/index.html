<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VAULT film</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the mark (src/assets/logo.svg), put here by the engine as #knot -->
  <svg class="sprite" aria-hidden="true"><defs id="sprite"></defs></svg>
  <div id="stage">
    <div id="bg">
      <!-- a medallion of fine lines around the frame, like the ground of a banknote:
           it drifts, and turns a notch at every cut -->
      <svg class="rosette" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    </div>
    <div id="scenes"></div>
  </div>
  <script src="engine.js"></script>
  <script src="scenes.js"></script>
</body>
</html>
