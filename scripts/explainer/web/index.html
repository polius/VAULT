<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VAULT video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bg">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <!-- a vault dial: it turns a notch at every cut, like a combination lock -->
      <svg class="dial" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
      <div class="dust"></div>
      <div class="vignette"></div>
    </div>
    <div id="scenes"></div>
    <!-- the seam of light that rides every cut, on the shield's diagonal -->
    <div id="sweep"></div>
    <div id="blackout"></div>
  </div>
  <script src="engine.js"></script>
  <script src="scenes.js"></script>
</body>
</html>
