# VAULT behind Caddy with automatic HTTPS. See the README.
services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    container_name: vault-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vault
    restart: unless-stopped

  vault:
    image: poliuscorp/vault
    container_name: vault
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
