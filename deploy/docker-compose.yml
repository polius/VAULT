# VAULT behind Caddy with automatic HTTPS. See the README.
services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: vault-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vault
    restart: unless-stopped

  vault:
    image: poliuscorp/vault
    container_name: vault
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
