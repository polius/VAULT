version: 2
updates:
  # GitHub Actions are pinned by commit SHA; Dependabot bumps SHA and comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # nginx base image (tag and digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  # Caddy in the HTTPS compose file.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  # Dev tooling and the vendored hash-wasm source. After a hash-wasm bump, run
  # `npm run vendor`; CI's vendor:check fails until the vendored file matches.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      dev:
        patterns: ["*"]

  # Playwright and axe for the E2E suite.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      e2e:
        patterns: ["*"]
