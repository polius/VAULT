name: Dependabot auto-merge

# Automatically approve and merge Dependabot pull requests, excluding major
# version bumps (those need human review). Requires two repository settings:
#   1. Settings → General → Pull Requests → "Allow auto-merge"
#   2. Settings → Actions → General → Workflow permissions →
#      "Allow GitHub Actions to create and approve pull requests"

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge (minor/patch only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
