server {
    listen 8080;
    listen [::]:8080;
    root /vault;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript text/javascript image/svg+xml application/json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Revalidate everything on every load (cheap: ETag/304). The ES modules are
    # not content-hashed, so a cached old module next to a new one would break
    # the app after an upgrade. sw.js must never be stale either.
    # Keep in sync with scripts/serve.mjs (test/consistency.test.mjs checks it).
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; require-trusted-types-for 'script'; trusted-types vault" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
